# CloudViPER application stack.
#
# Ingress is Traefik, running as a separate stack, which watches the
# cloudviper_ingress network and reads routing from container labels. That
# network must exist before this stack starts:
#
#   docker network create cloudviper_ingress
#
# DOMAIN_NAME is the host the app answers on, and desktops are created as
# <uuid>.<APP_HOST>, so the certificate has to cover the wildcard. Traefik holds
# one wildcard for the zone, which is why no instance performs its own ACME
# exchange the way the old nginx-proxy arrangement did.
services:
  app:
    # Pulled, never built here.
    #
    # Building on the appliance means running a compiler alongside the desktops
    # it is meant to be serving. On a small host that competes for the memory
    # the desktops are using, and the kernel resolves the competition by killing
    # something; it took the whole machine down once. CI already builds this
    # image on a tag and publishes it, so the appliance runs the exact artefact
    # that was tested rather than whatever a build under memory pressure
    # produces.
    #
    # For local development: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
    # Pinned, not :latest. Prereleases deliberately do not move :latest, so it
    # does not exist for this line and a default pointing at it would fail with
    # a manifest error rather than anything explaining why. An appliance sets
    # APP_IMAGE in its .env to the release it should be running.
    image: ${APP_IMAGE:-ghcr.io/darrendignam/cloudviper-web-app:2.1.0-alpha.0}
    container_name: cloud-viper-gui-app
    # expose, not ports: Traefik reaches this over the ingress network, so the
    # application is never published on the host directly.
    expose:
      - '3000'
    # Uncomment for local dev/debugging only:
    # ports:
    #   - "3333:3000"
    restart: always
    env_file: ./web-app/.env.production.local
    environment:
      - NODE_ENV=production
    volumes:
      - ./web-app/logs:/usr/src/app/logs
      # The app creates and destroys instance containers, so it drives the host
      # Docker daemon. Instance containers never receive this themselves.
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts:/usr/src/app/scripts
      # Shared content offered to desktops. Read-only here because this process
      # only ever reads it to check a path; the Docker daemon performs the
      # actual mount into instances.
      #
      # Mounted at the same path inside and out, and that matters: this process
      # resolves the path while the daemon acts on it, so if the two disagreed
      # a check that passed here would mount something else there.
      - ${INSTANCE_VOLUME_ROOT:-/mnt/cloudviper}:${INSTANCE_VOLUME_ROOT:-/mnt/cloudviper}:ro
    # Bounded so the app can never again be the process that starves the host.
    # Steady state is around 55MB; this is headroom, not a target.
    #
    # It also holds an SSE connection per open dashboard, so the ceiling has to
    # cover a room of admins watching at once rather than the idle case.
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 128M
    depends_on:
      mysqldb:
        condition: service_healthy
    networks:
      - cloud-viper-net
      - cloudviper_ingress
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cloudviper-app.rule=Host(`${DOMAIN_NAME:-vipercloud.cc}`)"
      - "traefik.http.routers.cloudviper-app.entrypoints=websecure"
      - "traefik.http.routers.cloudviper-app.tls=true"
      - "traefik.http.routers.cloudviper-app.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.services.cloudviper-app.loadbalancer.server.port=3000"
      - "traefik.docker.network=cloudviper_ingress"
    command: [ "node", "dist/app.js" ]

  mysqldb:
    image: mysql:8.0
    container_name: cloud-viper-mysqldb
    restart: always
    env_file: ./web-app/.env.production.local
    # Measured at 277MB with a single user, which is 92% of the old 300M ceiling
    # and one busy room away from the OOM killer. The database dying is an
    # outage for everyone, so it gets the headroom rather than the squeeze.
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M
    # Loopback only. The database is reachable through an SSH tunnel when it is
    # needed and from nowhere else; publishing 3306 on a public address would
    # bypass the firewall through Docker's own iptables rules.
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ./volumes/mysql_8_data:/var/lib/mysql
      - ./mysql-config/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    command: --default-authentication-plugin=mysql_native_password --skip-log-bin --performance-schema=OFF
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - cloud-viper-net

  # Off by default. It is useful for support but it is another service holding
  # memory that desktops want, and another authenticated surface on the public
  # internet. Start it deliberately:
  #
  #   docker compose --profile tools up -d phpmyadmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: pma
    profiles: ["tools"]
    environment:
      PMA_HOST: mysqldb
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
    restart: always
    expose:
      - 80
    depends_on:
      - mysqldb
    networks:
      - cloud-viper-net
      - cloudviper_ingress
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pma-cloudviper.rule=Host(`pma.${DOMAIN_NAME:-vipercloud.cc}`)"
      - "traefik.http.routers.pma-cloudviper.entrypoints=websecure"
      - "traefik.http.routers.pma-cloudviper.tls=true"
      - "traefik.http.routers.pma-cloudviper.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.services.pma-cloudviper.loadbalancer.server.port=80"
      - "traefik.docker.network=cloudviper_ingress"

networks:
  # Instance containers join this too, so the app can reach their Selkies
  # control plane by container name.
  cloud-viper-net:
    name: cloud-viper-net
    driver: bridge
  # Created outside this stack, because Traefik owns it and outlives any
  # single application deploy.
  cloudviper_ingress:
    external: true
    name: cloudviper_ingress
